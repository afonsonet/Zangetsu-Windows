# Sonda manual: arranca o Suwayomi-Server num Windows e escreve no log a estrutura
# e as respostas reais da API (para construir o adaptador de manga sem adivinhar).
# Nao gera release. Log -> branch engine-probe-log (ficheiro probe.log).
name: engine-probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonda Suwayomi
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          Start-Transcript -Path "$env:RUNNER_TEMP\probe.log" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\suw" | Out-Null
          Set-Location "$env:RUNNER_TEMP\suw"
          $rel = gh api repos/Suwayomi/Suwayomi-Server/releases/latest | ConvertFrom-Json
          Write-Host "tag=$($rel.tag_name)"
          $rel.assets | ForEach-Object { Write-Host "asset: $($_.name) $($_.size)" }
          $asset = $rel.assets | Where-Object { $_.name -match "win" -and $_.name -match "\.zip$" } | Select-Object -First 1
          Write-Host "chosen=$($asset.name)"
          Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile "suw.zip"
          Get-ChildItem *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath .\app -Force }
          Get-ChildItem .\app -Recurse -Depth 2 | Select-Object -First 80 | ForEach-Object { $_.FullName.Replace((Get-Location).Path, '') + "  " + $_.Length }
          $root = (Get-ChildItem .\app -Directory | Select-Object -First 1).FullName
          if (-not $root) { $root = (Resolve-Path .\app).Path }
          Write-Host "root=$root"
          $java = Get-ChildItem $root -Recurse -Filter java.exe | Select-Object -First 1
          $jar  = Get-ChildItem (Join-Path $root "bin") -Filter "Suwayomi-Server*.jar" | Select-Object -First 1
          Write-Host "java=$($java.FullName) jar=$($jar.FullName)"
          & $java.FullName -version 2>&1
          $data = "$env:RUNNER_TEMP\suwdata"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $jargs = @("-Dsuwayomi.tachidesk.config.server.rootDir=$data",
                    "-Dsuwayomi.tachidesk.config.server.initialOpenInBrowserEnabled=false",
                    "-Dsuwayomi.tachidesk.config.server.systemTrayEnabled=false",
                    "-Dsuwayomi.tachidesk.config.server.ip=127.0.0.1",
                    "-Dsuwayomi.tachidesk.config.server.port=4567",
                    "-jar", $jar.FullName)
          $p = Start-Process -FilePath $java.FullName -ArgumentList $jargs -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\suw.out" -RedirectStandardError "$env:RUNNER_TEMP\suw.err" -WindowStyle Hidden
          $up = $false
          for ($i=0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4567/api/graphql -Method Post -ContentType "application/json" -Body '{"query":"{ aboutServer { name version buildType } }"}'; Write-Host "UP: $($r.Content)"; $up = $true; break } catch { }
          }
          Write-Host "up=$up"
          function Gql($q) { try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4567/api/graphql -Method Post -ContentType "application/json" -Body (@{query=$q} | ConvertTo-Json -Compress)).Content } catch { "ERR: $_" } }
          function Show($title, $text) { Write-Host "--- $title ---"; $s = "$text"; if ($s.Length -gt 2500) { $s = $s.Substring(0,2500) + " ...[cortado]" }; Write-Host $s }
          if ($up) {
            Show "set repo" (Gql 'mutation { setSettings(input: { settings: { extensionRepos: ["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"] } }) { settings { extensionRepos } } }')
            Show "fetchExtensions" (Gql 'mutation { fetchExtensions(input: {}) { extensions { pkgName name lang isInstalled isObsolete hasUpdate } } }')
            Show "install mangadex" (Gql 'mutation { updateExtension(input: { id: "eu.kanade.tachiyomi.extension.all.mangadex", patch: { install: true } }) { extension { pkgName isInstalled } } }')
            Start-Sleep -Seconds 8
            $srcs = Gql '{ sources { nodes { id name lang displayName isNsfw supportsLatest iconUrl } } }'
            Show "sources" $srcs
            $sid = ($srcs | ConvertFrom-Json).data.sources.nodes | Where-Object { $_.name -match "MangaDex" -and $_.lang -eq "en" } | Select-Object -First 1 -ExpandProperty id
            Write-Host "sid=$sid"
            if ($sid) {
              $pop = Gql "mutation { fetchSourceManga(input: { source: \"$sid\", type: POPULAR, page: 1 }) { hasNextPage mangas { id title thumbnailUrl url } } }"
              Show "popular" $pop
              $mid = ($pop | ConvertFrom-Json).data.fetchSourceManga.mangas | Select-Object -First 1 -ExpandProperty id
              Write-Host "mid=$mid"
              if ($mid) {
                Show "fetchManga" (Gql "mutation { fetchManga(input: { id: $mid }) { manga { id title author artist description genre status thumbnailUrl realUrl } } }")
                $ch = Gql "mutation { fetchChapters(input: { mangaId: $mid }) { chapters { id name chapterNumber scanlator uploadDate url } } }"
                Show "chapters" $ch
                $cid = ($ch | ConvertFrom-Json).data.fetchChapters.chapters | Select-Object -First 1 -ExpandProperty id
                Write-Host "cid=$cid"
                if ($cid) {
                  $pg = Gql "mutation { fetchChapterPages(input: { chapterId: $cid }) { pages chapter { id pageCount } } }"
                  Show "pages" $pg
                  $first = ($pg | ConvertFrom-Json).data.fetchChapterPages.pages | Select-Object -First 1
                  Write-Host "first page=$first"
                  if ($first) { try { $img = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4567$first"; Write-Host "image: $($img.StatusCode) $($img.Headers['Content-Type']) $($img.RawContentLength) bytes" } catch { Write-Host "image ERR: $_" } }
                }
              }
            }
          }
          Write-Host "--- suw.out (tail, sem progresso de download) ---"
          Get-Content "$env:RUNNER_TEMP\suw.out" -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch "Downloading \d+%" } | Select-Object -Last 60
          Write-Host "--- suw.err (tail) ---"
          Get-Content "$env:RUNNER_TEMP\suw.err" -Tail 60 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p.Kill() }
          Stop-Transcript | Out-Null
      - name: Publicar log
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lg" && cd "$RUNNER_TEMP/lg"
          cat "$RUNNER_TEMP/probe.log" > probe.log 2>/dev/null || echo "sem log" > probe.log
          git init -q -b engine-probe-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe.log
          git commit -q -m "probe ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" engine-probe-log
