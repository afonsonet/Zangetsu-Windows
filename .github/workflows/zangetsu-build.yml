# Build gratuito (GitHub Actions) do Zangetsu: Android (telemóvel + TV) e Windows.
# O log de cada job é publicado numa branch (build-logs-android / build-logs-windows)
# para que o Claude o consiga ler e corrigir os erros.
name: build

on:
  workflow_dispatch:   # botão "Run workflow" no separador Actions
  push:
    branches: [windows-port]

env:
  # Versao da Release do Windows (Windows-Port X.Y). Sobe 0.1 de cada vez.
  WINDOWS_PORT_VERSION: "0.2"

permissions:
  contents: write      # necessário só para publicar o log nas branches build-logs-*

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APKs
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            flutter build apk --release --split-per-abi   # telemóveis
            flutter build apk --release                    # APK único (ABIs ARM) para Android TV
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publicar log
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lg" && cd "$RUNNER_TEMP/lg"
          tail -n 1500 "$RUNNER_TEMP/build.log" > android.log || echo "sem log" > android.log
          git init -q -b build-logs-android
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add android.log
          git commit -q -m "log do run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs-android
      - uses: actions/upload-artifact@v4
        with:
          name: zangetsu-android
          path: build/app/outputs/flutter-apk/*.apk
      - name: Publicar Release (APKs para descarregar)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --cleanup-tag -y --repo ${{ github.repository }} || true
          gh release create android-latest build/app/outputs/flutter-apk/*.apk --repo ${{ github.repository }} --prerelease --target ${{ github.sha }} --title "Android (teste)" --notes "Build automatico do commit ${{ github.sha }}."

  windows:
    runs-on: windows-latest
    continue-on-error: true   # esperado falhar até o port estar pronto; o log diz o que falta
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            flutter config --enable-windows-desktop
            if [ ! -d windows ]; then flutter create --platforms=windows --project-name watch_app .; fi
            # Marca Zangetsu (icone, nome) + fix STL1011; ver tool/patch_windows.sh
            bash tool/patch_windows.sh
            flutter pub get
            flutter build windows --release
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publicar log
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lg" && cd "$RUNNER_TEMP/lg"
          tail -n 1500 "$RUNNER_TEMP/build.log" > windows.log || echo "sem log" > windows.log
          git init -q -b build-logs-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add windows.log
          git commit -q -m "log do run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs-windows
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zangetsu-windows
          path: build/windows/x64/runner/Release/**
      - name: Publicar Release (zip para descarregar)
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:WINDOWS_PORT_VERSION
          $tag = "windows-port-$v"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Zangetsu-Windows.zip -Force
          # Cada versao tem a sua tag e as anteriores ficam. Re-correr a MESMA versao substitui-a.
          gh release delete $tag --cleanup-tag -y --repo ${{ github.repository }} 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag Zangetsu-Windows.zip --repo ${{ github.repository }} --prerelease --target ${{ github.sha }} --title "Windows-Port $v" --notes "Build automatico do commit ${{ github.sha }}. Extrai o zip e abre Zangetsu.exe."
