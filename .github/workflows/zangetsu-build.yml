# Coloca este ficheiro no teu FORK do Zangetsu em: .github/workflows/build.yml
# Corre grátis nos runners do GitHub Actions (repositórios públicos: minutos ilimitados).
# NÃO TESTADO: escrito a partir da leitura do repositório, sem poder compilar no ambiente do Claude.
name: build

on:
  workflow_dispatch:   # botão "Run workflow" no separador Actions
  push:
    branches: [windows-port]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi   # telemóveis
      - run: flutter build apk --release                    # APK único (ABIs ARM) para Android TV
      - uses: actions/upload-artifact@v4
        with:
          name: zangetsu-android
          path: build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    continue-on-error: true   # esperado falhar até o port estar pronto; os logs dizem o que falta
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Gerar a pasta windows/ se não existir
        shell: bash
        run: |
          if [ ! -d windows ]; then flutter create --platforms=windows --project-name watch_app .; fi
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zangetsu-windows
          path: build/windows/x64/runner/Release/**
