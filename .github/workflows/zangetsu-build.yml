# Build gratuito (GitHub Actions) do Zangetsu para Windows.
# O log do build é publicado na branch build-logs-windows (útil para diagnosticar falhas).
name: build

on:
  workflow_dispatch:   # botão "Run workflow" no separador Actions
  push:
    branches: [windows-port]

env:
  # Versao da Release do Windows (Windows-Port X.Y). Sobe 0.1 de cada vez.
  WINDOWS_PORT_VERSION: "0.5"

permissions:
  contents: write      # necessário só para publicar o log nas branches build-logs-*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: tools/cfhelper/go.mod
      - name: Build cfhelper (Chrome TLS helper)
        shell: bash
        run: |
          set -o pipefail
          {
            cd tools/cfhelper
            go get github.com/bogdanfinn/tls-client@latest
            go mod tidy
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/cfhelper.exe" .
          } 2>&1 | tee "$RUNNER_TEMP/helper.log"
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            flutter config --enable-windows-desktop
            if [ ! -d windows ]; then flutter create --platforms=windows --project-name watch_app .; fi
            # Marca Zangetsu (icone, nome) + fix STL1011; ver tool/patch_windows.sh
            bash tool/patch_windows.sh
            flutter pub get
            flutter build windows --release
            mkdir -p build/windows/x64/runner/Release/cf-helper
            cp "$RUNNER_TEMP/cfhelper.exe" build/windows/x64/runner/Release/cf-helper/cfhelper.exe
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publicar log
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lg" && cd "$RUNNER_TEMP/lg"
          { cat "$RUNNER_TEMP/helper.log" 2>/dev/null; tail -n 1500 "$RUNNER_TEMP/build.log"; } > windows.log || echo "sem log" > windows.log
          git init -q -b build-logs-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add windows.log
          git commit -q -m "log do run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs-windows
      - name: Motor de manga (Suwayomi-Server + Java)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Versao fixa: o adaptador (lib/core/desktop/manga_engine.dart) foi escrito contra esta API.
          $rel = gh api repos/Suwayomi/Suwayomi-Server/releases/tags/v2.4.2366 | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match "windows-x64\.zip$" } | Select-Object -First 1
          Write-Host "Suwayomi $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\suw.zip"
          Expand-Archive "$env:RUNNER_TEMP\suw.zip" -DestinationPath "$env:RUNNER_TEMP\suw" -Force
          $src = (Get-ChildItem "$env:RUNNER_TEMP\suw" -Directory | Select-Object -First 1).FullName
          $dst = "build/windows/x64/runner/Release/manga-engine"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # So jre + bin (sem o Electron, 290 MB que nao usamos).
          Copy-Item "$src\jre" "$dst\jre" -Recurse
          Copy-Item "$src\bin" "$dst\bin" -Recurse
          if (-not (Test-Path "$dst\jre\bin\javaw.exe") -or -not (Test-Path "$dst\bin\Suwayomi-Server.jar")) { throw "motor de manga incompleto" }
          Write-Host ("manga-engine: {0:N0} MB" -f ((Get-ChildItem $dst -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zangetsu-windows
          path: build/windows/x64/runner/Release/**
      - name: Publicar Release (zip para descarregar)
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:WINDOWS_PORT_VERSION
          $tag = "windows-port-$v"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Zangetsu-Windows.zip -Force
          # Cada versao tem a sua tag e as anteriores ficam. Re-correr a MESMA versao substitui-a.
          gh release delete $tag --cleanup-tag -y --repo ${{ github.repository }} 2>$null
          $global:LASTEXITCODE = 0
          $notes = "release_notes/$v.md"
          if (Test-Path $notes) {
            gh release create $tag Zangetsu-Windows.zip --repo ${{ github.repository }} --prerelease --target ${{ github.sha }} --title "Windows-Port $v" --notes-file $notes
          } else {
            gh release create $tag Zangetsu-Windows.zip --repo ${{ github.repository }} --prerelease --target ${{ github.sha }} --title "Windows-Port $v" --notes "Build automatico do commit ${{ github.sha }}."
          }
